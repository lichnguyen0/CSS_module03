<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facebook Simplified</title>
    <link rel="stylesheet" href="style02.css">
</head>
<body>
<header>
    <h1>Facebook</h1>
    <input type="text" placeholder="Tìm kiếm...">
</header>

<div class="container">

    <!-- Sidebar trái -->
    <aside class="sidebar-left">
        <ul>
            <li>Trang chủ</li>
            <li>Bạn bè</li>
            <li>Nhóm</li>
            <li>Marketplace</li>
            <li>Watch</li>
        </ul>
    </aside>

    <!-- Nội dung chính -->
    <main>
        <div class="post">
            <h2>Bài viết 1</h2>
            <p>Đây là nội dung bài viết.</p>
        </div>

        <div class="post">
            <h2>Bài viết 2</h2>
            <p>Hello guys <br> ... more</p>
        </div>
    </main>

    <!-- Sidebar phải -->
    <aside class="sidebar-right">
        <h3>Người liên hệ</h3>
        <ul>
            <li>Nam</li>
            <li>Mai</li>
            <li>Hùng</li>
            <li>Lan</li>
        </ul>
    </aside>
</div>

</body>
</html>
